[project]
name = "sendit-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "bcrypt==4.0.1",
    "black>=26.5.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "psutil>=7.2.2",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "ruff>=0.16.2",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.1",
]

[tool.black]
target-version = ["py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = [
    "B008",
    "BLE001",
    "DTZ003",
    "DTZ005",
    "PLW1508",
    "ASYNC230"
]
